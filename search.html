<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search — MovieSuggest</title>
  <meta name="description" content="Search the MovieSuggest movie catalog by title, genre, year or director.">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="search">

  <!-- Navbar is rendered here by js/main.js -->
  <div id="site-header"></div>

  <main class="page">

    <!-- ================= SEARCH BAR ================= -->
    <section class="search-hero">
      <div class="container">
        <span class="kicker">Search</span>
        <h1 class="search-title">Search for movies...</h1>
        <form class="search-bar" id="search-form" autocomplete="off">
          <span class="search-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          </span>
          <input type="text" id="search-input" placeholder="e.g. Interstellar" aria-label="Search for movies">
          <button type="submit" class="btn btn-primary">Search</button>
        </form>
        <p class="search-hint">Search movies from the connected catalog.</p>
      </div>
    </section>

    <!-- ================= SEARCH RESULTS ================= -->
    <section class="section" style="padding-top:20px">
      <div class="container">
        <div class="section-head">
          <h2 class="section-title">Search Results</h2>
        </div>
        <p class="results-count" id="results-count"></p>
        <div class="movie-grid" id="search-results"><!-- filled by JS --></div>
        <div class="empty-state" id="search-empty" hidden>
          <div class="empty-icon">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          </div>
          <h3>No movies found</h3>
          <p>Try a different title, genre (e.g. "Sci-Fi"), year or director name.</p>
          <a href="index.html" class="btn btn-primary">Browse Movies</a>
        </div>
      </div>
    </section>

  </main>

  <!-- Footer is rendered here by js/main.js -->
  <div id="site-footer"></div>

  <script src="js/movies.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
