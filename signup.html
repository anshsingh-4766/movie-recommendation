<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — MovieSuggest</title>
  <meta name="description" content="Create your free MovieSuggest account.">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="signup">

  <!-- Navbar is rendered here by js/main.js -->
  <div id="site-header"></div>

  <main class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="logo">
        <span class="logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h18v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9z"/><path d="M3 9l2-5h16l-2 5"/><path d="M8 4.5 10 9M13 4.5 15 9"/></svg>
        </span>
        Movie<span>Suggest</span>
      </a>
      <h1>Create Account</h1>
      <p class="auth-sub">Join MovieSuggest and build your own watchlist.</p>

      <!-- Flask backend validates and stores new accounts. -->
      <form id="signup-form" novalidate>
        <div class="field">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" placeholder="Alex Morgan" autocomplete="name">
          <p class="field-error" id="error-signup-name"></p>
        </div>
        <div class="field">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email">
          <p class="field-error" id="error-signup-email"></p>
        </div>
        <div class="field">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" placeholder="At least 6 characters" autocomplete="new-password">
          <p class="field-error" id="error-signup-password"></p>
        </div>
        <div class="field">
          <label for="signup-confirm">Confirm Password</label>
          <input type="password" id="signup-confirm" placeholder="Repeat your password" autocomplete="new-password">
          <p class="field-error" id="error-signup-confirm"></p>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>

      <div class="auth-divider"><span>or</span></div>
      <a class="btn btn-google btn-block" href="/auth/google">Continue with Google</a>

      <p class="auth-alt">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </main>

  <!-- Footer is rendered here by js/main.js -->
  <div id="site-footer"></div>

  <script src="js/movies.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
